<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notizen">
<title>Notizen</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #d9dce1;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; }
  #bar {
    position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 50%;
    transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    background: #fff; padding: 6px; border-radius: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); z-index: 10;
  }
  #bar button {
    border: 0; background: #f1f2f4; border-radius: 10px; padding: 8px 12px;
    font-size: 16px; color: #222; touch-action: manipulation;
  }
  #bar button.on { background: #2563eb; color: #fff; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="ink"></canvas>

<div id="bar">
  <button id="pen" class="on">✏️ Stift</button>
  <button id="eraser">🧽 Radierer</button>
  <button id="undo">↩︎ Zurück</button>
  <button id="addPage">＋ Seite</button>
  <button id="finger">☝️ Finger: Bewegen</button>
  <button id="clear">🗑</button>
</div>

<script>
const bg = document.getElementById('bg');
const ink = document.getElementById('ink');
const bctx = bg.getContext('2d');
const ictx = ink.getContext('2d');

const PAGE_W = 820, PAGE_H = 1160, GAP = 30, LINE = 32;
const PEN_W = 2.4, ERASER_W = 26;

// ---------- Daten ----------
let data = { pages: 1, strokes: [] };
try {
  const saved = JSON.parse(localStorage.getItem('notiz-data'));
  if (saved && Array.isArray(saved.strokes)) data = saved;
} catch (e) {}

function save() {
  try { localStorage.setItem('notiz-data', JSON.stringify(data)); } catch (e) {}
}

// ---------- Ansicht ----------
let view = { x: 0, y: 0, s: 1 };
let dpr = 1;
let tool = 'pen';
let fingerDraws = false;

function fitPage() {
  const s = Math.min((innerWidth - 40) / PAGE_W, 1.2);
  view.s = s;
  view.x = (innerWidth - PAGE_W * s) / 2;
  view.y = 90;
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  for (const c of [bg, ink]) {
    c.width = Math.round(innerWidth * dpr);
    c.height = Math.round(innerHeight * dpr);
  }
  drawAll();
}

function applyT(ctx) {
  ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.x, dpr * view.y);
}

function toWorld(x, y) {
  return [(x - view.x) / view.s, (y - view.y) / view.s];
}

// ---------- Zeichnen ----------
function drawBg() {
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.clearRect(0, 0, bg.width, bg.height);
  applyT(bctx);
  for (let i = 0; i < data.pages; i++) {
    const top = i * (PAGE_H + GAP);
    bctx.fillStyle = '#fff';
    bctx.fillRect(0, top, PAGE_W, PAGE_H);
    bctx.strokeStyle = '#c9d7ee';
    bctx.lineWidth = 1 / view.s;
    for (let y = top + LINE * 3; y < top + PAGE_H - 10; y += LINE) {
      bctx.beginPath(); bctx.moveTo(0, y); bctx.lineTo(PAGE_W, y); bctx.stroke();
    }
    bctx.strokeStyle = '#b8bcc4';
    bctx.strokeRect(0, top, PAGE_W, PAGE_H);
  }
}

function widthAt(st, p) {
  if (st.t === 'e') return st.w;
  return st.w * (0.4 + p * 1.2);
}

function drawStroke(ctx, st, from) {
  ctx.globalCompositeOperation = st.t === 'e' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = ctx.fillStyle = '#111';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const p = st.p;
  if (p.length === 1 && from <= 1) {
    ctx.beginPath();
    ctx.arc(p[0][0], p[0][1], widthAt(st, p[0][2]) / 2, 0, Math.PI * 2);
    ctx.fill();
  }
  for (let i = Math.max(1, from); i < p.length; i++) {
    const a = p[i - 1], b = p[i];
    ctx.lineWidth = widthAt(st, b[2]);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawInk() {
  ictx.setTransform(1, 0, 0, 1, 0, 0);
  ictx.clearRect(0, 0, ink.width, ink.height);
  applyT(ictx);
  for (const st of data.strokes) drawStroke(ictx, st, 1);
}

function drawAll() { drawBg(); drawInk(); }

let raf = 0;
function requestDraw() {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; drawAll(); });
}

// ---------- Eingabe ----------
const touches = new Map();   // Finger für Zoom/Verschieben
let cur = null;              // aktueller Strich
let gesture = null;

function gestureState() {
  const pts = [...touches.values()];
  const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
  const cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
  const d = pts.length > 1 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) : 0;
  return { cx, cy, d };
}

function startGesture() {
  gesture = touches.size ? { start: gestureState(), v: { ...view } } : null;
}

function pressureOf(e) {
  return e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5;
}

function addPoint(e) {
  const [x, y] = toWorld(e.clientX, e.clientY);
  cur.st.p.push([Math.round(x * 10) / 10, Math.round(y * 10) / 10, Math.round(pressureOf(e) * 100) / 100]);
}

ink.addEventListener('pointerdown', e => {
  ink.setPointerCapture(e.pointerId);
  const isTouch = e.pointerType === 'touch';
  if (isTouch) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });

  const canDraw = !isTouch || (fingerDraws && touches.size === 1);
  if (canDraw && !cur) {
    const st = { t: tool === 'eraser' ? 'e' : 'p', w: tool === 'eraser' ? ERASER_W : PEN_W, p: [] };
    data.strokes.push(st);
    cur = { id: e.pointerId, st, touch: isTouch };
    addPoint(e);
    applyT(ictx);
    drawStroke(ictx, st, 0);
    return;
  }
  if (isTouch) {
    // zweiter Finger beim Fingerzeichnen -> Strich verwerfen, stattdessen zoomen
    if (cur && cur.touch) { data.strokes.pop(); cur = null; requestDraw(); }
    startGesture();
  }
});

ink.addEventListener('pointermove', e => {
  if (cur && e.pointerId === cur.id) {
    const from = cur.st.p.length;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) addPoint(ev);
    applyT(ictx);
    drawStroke(ictx, cur.st, from);
    return;
  }
  if (e.pointerType === 'touch' && touches.has(e.pointerId)) {
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gesture) return;
    const g = gestureState(), s0 = gesture.start, v0 = gesture.v;
    let s = (s0.d > 0 && g.d > 0) ? v0.s * g.d / s0.d : v0.s;
    s = Math.min(6, Math.max(0.25, s));
    const wx = (s0.cx - v0.x) / v0.s, wy = (s0.cy - v0.y) / v0.s;
    view.s = s;
    view.x = g.cx - wx * s;
    view.y = g.cy - wy * s;
    requestDraw();
  }
});

function endPointer(e) {
  if (cur && e.pointerId === cur.id) { cur = null; save(); }
  if (touches.has(e.pointerId)) {
    touches.delete(e.pointerId);
    startGesture();
  }
}
ink.addEventListener('pointerup', endPointer);
ink.addEventListener('pointercancel', endPointer);

// iOS-Eigenheiten abschalten (Lupe, Seiten-Zoom)
ink.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// Mausrad / Trackpad (am Computer)
ink.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey) {
    const f = Math.exp(-e.deltaY * 0.01);
    const s = Math.min(6, Math.max(0.25, view.s * f));
    const [wx, wy] = toWorld(e.clientX, e.clientY);
    view.s = s;
    view.x = e.clientX - wx * s;
    view.y = e.clientY - wy * s;
  } else {
    view.x -= e.deltaX;
    view.y -= e.deltaY;
  }
  requestDraw();
}, { passive: false });

// ---------- Knöpfe ----------
const $ = id => document.getElementById(id);
function setTool(t) {
  tool = t;
  $('pen').classList.toggle('on', t === 'pen');
  $('eraser').classList.toggle('on', t === 'eraser');
}
$('pen').onclick = () => setTool('pen');
$('eraser').onclick = () => setTool('eraser');
$('undo').onclick = () => { data.strokes.pop(); save(); requestDraw(); };
$('addPage').onclick = () => { data.pages++; save(); requestDraw(); };
$('finger').onclick = () => {
  fingerDraws = !fingerDraws;
  $('finger').textContent = fingerDraws ? '☝️ Finger: Schreiben' : '☝️ Finger: Bewegen';
  $('finger').classList.toggle('on', fingerDraws);
};
$('clear').onclick = () => {
  if (confirm('Alles löschen?')) { data = { pages: 1, strokes: [] }; save(); fitPage(); requestDraw(); }
};

window.addEventListener('resize', resize);
fitPage();
resize();
</script>
</body>
</html>
